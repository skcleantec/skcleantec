    <meta property="og:title" content="청소비서 — 청소업체 접수·배정·정산 올인원 SaaS" />
    <meta property="og:description" content="접수부터 정산까지 한 시스템에서. 청소업체 전용 업무관리 플랫폼." />

    <meta name="theme-color" content="#121828" />
    <title>청소비서 | 청소업체 업무관리 SaaS</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/app-icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/app-icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        var path = location.pathname;
        if (path !== '/m/quote' && path.indexOf('/m/quote/') !== 0) return;
        var link = document.querySelector('link[rel="manifest"]');
        if (link) link.setAttribute('href', '/m/quote.webmanifest');
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute('content', '#F1F4F9');
        function meta(name, content) {
          var el = document.querySelector('meta[name="' + name + '"]');
          if (!el) {
            el = document.createElement('meta');
            el.setAttribute('name', name);
            el.setAttribute('data-quote-pwa', '1');
            document.head.appendChild(el);
          }
          el.setAttribute('content', content);
        }
        meta('apple-mobile-web-app-capable', 'yes');
        meta('mobile-web-app-capable', 'yes');
        meta('apple-mobile-web-app-status-bar-style', 'default');
        meta('apple-mobile-web-app-title', '견적');
        // 홈 화면 설치 — 크롬이 주는 설치 이벤트를 화면이 뜨기 전에 잡아 둔다
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__cbiseoQuoteInstallPrompt = e;
          window.dispatchEvent(new Event('cbiseo:quote-install-ready'));
        });
        window.addEventListener('appinstalled', function () {
          window.__cbiseoQuoteInstallPrompt = null;
          window.dispatchEvent(new Event('cbiseo:quote-installed'));
        });
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/m/quote-sw.js', { scope: '/m/' }).catch(function () {});
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
