# 숨고 크롤링 자동화(SoomgoAutomation) — GitHub Release ZIP

name: Soomgo Automation Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver (예: 1.0.1)'
        required: true
        default: '1.0.1'
  push:
    tags:
      - 'soomgo-automation-v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -match '^soomgo-automation-v(.+)$') {
            $v = $Matches[1]
          } else {
            $v = '${{ inputs.version }}'
            if (-not $v) { $v = '1.0.1' }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Packaging version: $v"

      - name: Resolve source paths
        id: paths
        shell: pwsh
        run: |
          $root = Get-Location
          $sourceDir = Get-ChildItem -Path $root -Directory -Recurse -Depth 2 -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'scripts/build-release.ps1') } |
            Select-Object -First 1
          if (-not $sourceDir) {
            throw 'Soomgo automation source_project folder not found (scripts/build-release.ps1)'
          }
          $projectRoot = Split-Path $sourceDir.FullName -Parent
          $distRoot = Join-Path $projectRoot 'dist-release'
          "source_dir=$($sourceDir.FullName)" >> $env:GITHUB_OUTPUT
          "project_root=$($projectRoot.FullName)" >> $env:GITHUB_OUTPUT
          "dist_root=$distRoot" >> $env:GITHUB_OUTPUT
          Write-Host "Source: $($sourceDir.FullName)"
          Write-Host "Dist: $distRoot"

      - name: Install dependencies
        shell: pwsh
        run: |
          pip install -r "${{ steps.paths.outputs.source_dir }}/requirements.txt"
          pip install pyinstaller

      - name: Build release ZIP
        shell: pwsh
        run: |
          & "${{ steps.paths.outputs.source_dir }}/scripts/build-release.ps1" -Version ${{ steps.ver.outputs.version }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: soomgo-automation-v${{ steps.ver.outputs.version }}
          name: Soomgo Automation v${{ steps.ver.outputs.version }}
          body: |
            숨고 크롤링 자동화 v${{ steps.ver.outputs.version }}

            **사용자 PC:** 프로그램에서 「업데이트」 버튼 → 자동 다운로드·교체·재시작
            **수동:** `SoomgoAutomation-*.zip` 압축 해제 후 `SoomgoAutomation.exe` 실행

            Railway: `railway-env-*.txt` → Variables (SOOMGO_AUTOMATION_*)
          files: |
            ${{ steps.paths.outputs.dist_root }}/SoomgoAutomation-${{ steps.ver.outputs.version }}.zip
            ${{ steps.paths.outputs.dist_root }}/railway-env-${{ steps.ver.outputs.version }}.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
